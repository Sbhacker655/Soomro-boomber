<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ SOOMRO CALL BOMBER v2.0 ⚡</title>
    <!-- Google Fonts for Gaming / Cyberpunk Feel -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #05050d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Radial Background */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,128,0.4) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 15%;
            filter: blur(50px);
            animation: floatGlow 6s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,242,254,0.4) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 15%;
            filter: blur(50px);
            animation: floatGlow 6s infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }

        /* RGB Glowing Card Outer Box */
        .card-wrapper {
            position: relative;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(45deg, #ff0055, #7600ff, #00d2ff, #ff0055);
            background-size: 400% 400%;
            animation: rgbBorder 5s ease infinite;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            z-index: 10;
        }

        @keyframes rgbBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Body */
        .card {
            background: rgba(13, 13, 24, 0.95);
            backdrop-filter: blur(15px);
            padding: 35px 30px;
            border-radius: 17px;
            width: 360px;
            text-align: center;
        }

        /* Branding Headers */
        .brand-badge {
            display: inline-block;
            background: linear-gradient(90deg, #ff0055, #ff5e00);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            margin-bottom: 5px;
        }

        .dev-tagline {
            font-size: 13px;
            color: #a0a0c0;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .dev-tagline span {
            color: #ff0077;
            font-weight: 700;
        }

        /* Form Controls */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d2ff;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(22, 22, 40, 0.8);
            border: 2px solid #282846;
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #62628a;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
            background: rgba(30, 30, 55, 0.9);
        }

        /* Neon Fire Button */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff0055, #ff5e00, #ff0055);
            background-size: 200% auto;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        button:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 94, 0, 0.8);
        }

        button:active {
            transform: translateY(0);
        }

        /* Result Area */
        #result {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 700;
            min-height: 24px;
            letter-spacing: 0.5px;
        }

        /* Developer Footer Branding */
        .footer-branding {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-branding .dev-info {
            text-align: left;
        }

        .footer-branding .dev-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #fff;
            font-weight: 700;
        }

        .footer-branding .dev-handle {
            font-size: 12px;
            color: #00f2fe;
            text-decoration: none;
            font-weight: 600;
        }

        .social-icons a {
            color: #a0a0c0;
            margin-left: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="card">
            <span class="brand-badge"><i class="fa-solid fa-shield-halved"></i> OFFICIAL TOOL</span>
            <h2>🔥 SOOMRO BOMBER 🔥</h2>
            <div class="dev-tagline">POWERED BY <span>@SOOMRO ENGINE</span></div>

            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="text" id="phone" placeholder="Target Phone Number">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-bolt"></i>
                <input type="number" id="attempts" placeholder="Call Attempts (Max 5)" value="5" max="5" min="1">
            </div>

            <button onclick="startBomb()">
                <i class="fa-solid fa-fire"></i> LAUNCH ENGINE
            </button>

            <p id="result"></p>

            <!-- Heavy Soomro Branding Footer -->
            <div class="footer-branding">
                <div class="dev-info">
                    <div class="dev-name">DEVELOPED BY</div>
                    <a href="https://t.me/soomro" target="_blank" class="dev-handle">@soomro</a>
                </div>
                <div class="social-icons">
                    <a href="#" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
                    <a href="#" title="GitHub"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function startBomb() {
            const phoneInput = document.getElementById('phone');
            const attemptsInput = document.getElementById('attempts');
            const resBox = document.getElementById('result');
            
            const phone = phoneInput.value.trim();
            const attempts = attemptsInput.value;

            if (!phone) {
                resBox.style.color = "#ff0055";
                resBox.innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> Please enter target number!";
                return;
            }

            resBox.style.color = "#00f2fe";
            resBox.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Dispatched by Soomro Engine...";
            
            try {
                let response = await fetch('/api/bomb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, attempts: parseInt(attempts) })
                });
                
                let data = await response.json();
                
                if (response.ok) {
                    resBox.style.color = "#00ff88";
                    resBox.innerHTML = `<i class='fa-solid fa-circle-check'></i> Attack Done! Processed: ${data.processed} calls.`;
                } else {
                    resBox.style.color = "#ff0055";
                    resBox.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Server Error!";
                }
            } catch (err) {
                resBox.style.color = "#ff0055";
                resBox.innerHTML = "<i class='fa-solid fa-wifi'></i> Connection failed!";
            }
        }
    </script>
</body>
</html>
